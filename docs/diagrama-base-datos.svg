<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title description">
  <title id="title">Base de datos local GANUS y sincronización con staging</title>
  <desc id="description">Diagrama en español del flujo entre staging remoto y las tablas locales de la aplicación.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2874A6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#16835B"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17352A; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #587065; }
      .section { font-size: 19px; font-weight: 700; }
      .box-title { font-size: 16px; font-weight: 700; }
      .body { font-size: 13px; fill: #42584E; }
      .small { font-size: 12px; fill: #587065; }
      .table { fill: #FFFFFF; stroke: #C8DCD0; stroke-width: 1.5; }
      .remote { fill: #F1F6FA; stroke: #B5CCDB; stroke-width: 1.5; }
      .green { fill: #EAF5EE; stroke: #9BCBB0; stroke-width: 1.5; }
      .amber { fill: #FFF7E8; stroke: #E7CB91; stroke-width: 1.5; }
      .line-in { fill: none; stroke: #2874A6; stroke-width: 3; marker-end: url(#arrow-blue); }
      .line-out { fill: none; stroke: #16835B; stroke-width: 3; marker-end: url(#arrow-green); }
      .rule { stroke: #DCE8DF; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="#F7FAF7"/>
  <text x="48" y="58" class="title">Base de datos local y sincronización</text>
  <text x="48" y="86" class="subtitle">Room local ya funciona; staging y sincronización están diseñados, pero aún no conectados.</text>

  <rect x="48" y="126" width="280" height="300" rx="20" class="remote"/>
  <text x="72" y="164" class="section">Staging (por conectar)</text>
  <text x="72" y="196" class="body">Publica tareas y versiones de formulario</text>
  <text x="72" y="220" class="body">Acepta alertas y respuestas</text>
  <text x="72" y="244" class="body">Confirma identificadores y sincronización</text>
  <line x1="72" y1="264" x2="304" y2="264" class="rule"/>
  <rect x="72" y="282" width="232" height="52" rx="12" fill="#FFFFFF" stroke="#B5CCDB"/>
  <text x="90" y="304" class="box-title">Cambios para descargar</text>
  <text x="90" y="323" class="small">cursor · identificador · versión</text>
  <rect x="72" y="350" width="232" height="52" rx="12" fill="#FFFFFF" stroke="#B5CCDB"/>
  <text x="90" y="372" class="box-title">Cambios para enviar</text>
  <text x="90" y="391" class="small">aceptación · rechazo · id remoto</text>

  <rect x="384" y="126" width="244" height="300" rx="20" class="green"/>
  <text x="408" y="164" class="section">Sincronización futura</text>
  <text x="408" y="199" class="body">1. Descargar eventos con cursor</text>
  <text x="408" y="226" class="body">2. Validar y guardar en Room</text>
  <text x="408" y="253" class="body">3. Enviar cola pendiente</text>
  <text x="408" y="280" class="body">4. Reintentar con la misma clave</text>
  <line x1="408" y1="300" x2="604" y2="300" class="rule"/>
  <text x="408" y="326" class="small">Este flujo aún no está implementado;</text>
  <text x="408" y="346" class="small">la app ya guarda y consulta en local.</text>
  <text x="408" y="382" class="small">Falta el contrato real del servidor.</text>

  <path d="M328 280H376" class="line-in"/>
  <text x="332" y="264" class="small">futura descarga</text>
  <path d="M376 362H328" class="line-out"/>
  <text x="333" y="390" class="small">futuro envío</text>

  <rect x="684" y="112" width="708" height="870" rx="24" fill="#F0F6F1" stroke="#AFC9B8" stroke-width="2"/>
  <text x="712" y="151" class="section">Móvil GANUS · base local SQLite</text>
  <text x="712" y="176" class="small">Room · relaciones con claves foráneas · campos dinámicos como filas</text>

  <path d="M628 225H676V226H710" class="line-in"/>
  <path d="M710 764H676V365H628" class="line-out"/>

  <rect x="716" y="204" width="286" height="112" rx="14" class="table"/>
  <text x="736" y="232" class="box-title">estado_sincronizacion</text>
  <text x="736" y="255" class="body">cursor por flujo · última sincronización</text>
  <text x="736" y="277" class="body">eventos_recibidos: id · contenido · estado</text>
  <text x="736" y="299" class="small">descargas deduplicadas antes de aplicar</text>

  <rect x="1032" y="204" width="332" height="112" rx="14" class="amber"/>
  <text x="1052" y="232" class="box-title">plantillas_tarea</text>
  <text x="1052" y="255" class="body">(id_plantilla, versión) · título · activa</text>
  <text x="1052" y="277" class="body">Las versiones publicadas son inmutables</text>
  <text x="1052" y="299" class="small">una versión nueva preserva formularios previos</text>

  <rect x="1032" y="344" width="332" height="146" rx="14" class="amber"/>
  <text x="1052" y="372" class="box-title">campos_tarea</text>
  <text x="1052" y="395" class="body">id_plantilla + versión + clave_campo</text>
  <text x="1052" y="417" class="body">etiqueta · tipo · obligatorio · orden</text>
  <text x="1052" y="439" class="body">opciones y validaciones</text>
  <text x="1052" y="466" class="small">define qué campos dibuja la tarea</text>

  <rect x="716" y="344" width="286" height="146" rx="14" class="table"/>
  <text x="736" y="372" class="box-title">tareas</text>
  <text x="736" y="395" class="body">instancia concreta asignada</text>
  <text x="736" y="417" class="body">id_plantilla + versión</text>
  <text x="736" y="439" class="body">estado · finca · asignado · fechas</text>
  <text x="736" y="466" class="small">cada tarea conserva su definición de origen</text>

  <rect x="1032" y="518" width="332" height="132" rx="14" class="table"/>
  <text x="1052" y="546" class="box-title">respuestas_tarea</text>
  <text x="1052" y="569" class="body">tarea + clave_campo</text>
  <text x="1052" y="591" class="body">valor_texto / numero / booleano / fecha / JSON</text>
  <text x="1052" y="623" class="small">solo se usa el valor tipado correspondiente</text>

  <rect x="716" y="518" width="286" height="132" rx="14" class="green"/>
  <text x="736" y="546" class="box-title">alertas</text>
  <text x="736" y="569" class="body">id · título · descripción · prioridad</text>
  <text x="736" y="591" class="body">estado · creador · fecha</text>
  <text x="736" y="623" class="small">se guarda primero en el dispositivo</text>

  <rect x="716" y="682" width="286" height="132" rx="14" class="table"/>
  <text x="736" y="710" class="box-title">adjuntos</text>
  <text x="736" y="733" class="body">propietario · URI local · tipo MIME · tamaño</text>
  <text x="736" y="755" class="body">estado de carga · nombre · id remoto</text>
  <text x="736" y="787" class="small">archivo privado fuera de la base, por referencia</text>

  <rect x="1032" y="682" width="332" height="132" rx="14" class="green"/>
  <text x="1052" y="710" class="box-title">eventos_pendientes</text>
  <text x="1052" y="733" class="body">id idempotente · entidad · contenido</text>
  <text x="1052" y="755" class="body">estado · intentos · próximo reintento · error</text>
  <text x="1052" y="787" class="small">se guarda localmente; aún no se envía</text>

  <rect x="716" y="832" width="286" height="120" rx="14" class="table"/>
  <text x="736" y="860" class="box-title">vacas</text>
  <text x="736" y="883" class="body">número · nombre · raza · edad · tag</text>
  <text x="736" y="925" class="small">catálogo local disponible sin conexión</text>

  <rect x="1032" y="832" width="332" height="120" rx="14" class="green"/>
  <text x="1052" y="860" class="box-title">registros_ordenio</text>
  <text x="1052" y="883" class="body">vaca · litros · alimentación · salud · clima</text>
  <text x="1052" y="925" class="small">registro local; no se envía todavía</text>

  <path d="M1002 260H1024" fill="none" stroke="#788C80" stroke-width="2"/>
  <path d="M1198 316V336" fill="none" stroke="#788C80" stroke-width="2"/>
  <path d="M1002 417H1024" fill="none" stroke="#788C80" stroke-width="2"/>
  <path d="M1198 490V510" fill="none" stroke="#788C80" stroke-width="2"/>
  <path d="M859 490V510" fill="none" stroke="#788C80" stroke-width="2"/>
  <path d="M859 650V674" fill="none" stroke="#788C80" stroke-width="2"/>
  <path d="M1002 748H1024" fill="none" stroke="#788C80" stroke-width="2"/>

  <text x="48" y="1024" class="small">Esquema local conectado a la interfaz · faltan staging, autenticación, permisos y reglas de conflicto.</text>
</svg>
